name: Scrape Opportunities

on:
  schedule:
    - cron: "0 10 * * 2"
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape tier ${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      matrix:
        tier: [1, 2, 3, 4]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browser
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_TIER: ${{ matrix.tier }}
          # WordPress auto-login for subscription sources (artinfoland.com) —
          # cookie files are gitignored, so CI relies on these to establish a session
          ARTINFOLAND_EMAIL: ${{ secrets.ARTINFOLAND_EMAIL }}
          ARTINFOLAND_PASSWORD: ${{ secrets.ARTINFOLAND_PASSWORD }}
        run: npm run scrape

  # Collapse cross-posted duplicates once all tiers have finished.
  dedupe:
    name: Dedupe pass
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled()
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Run dedupe pass
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dedupe

      # Weekly geo-eligibility sweep: demote listings NZ/AUS artists can't
      # enter that slipped past the extraction-time gate. NZ/AUS-tagged rows
      # are never touched (deterministic guard in the tool).
      - name: Run geo-eligibility audit
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx tools/geo-audit.ts

  # Discovery-level regression guard: fails when a source that historically
  # yielded >5 items silently drops to zero (selector break / bot wall).
  yield-guard:
    name: Zero-yield guard
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled()
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browser
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run yield guard
        working-directory: scraper
        run: npm run guard
